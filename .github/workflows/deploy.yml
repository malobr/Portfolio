name: Deploy Portfólio

on:
  push:
    branches: [ main ] # Dispara o deploy sempre que houver push na main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Versão que você usa

      - name: Install Dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

  deploy:
    needs: laravel-tests # Só faz deploy se os testes passarem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Sync Files (via FTP ou SSH)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/Portfolio # Pasta no seu domínio
