name: Deploy Portfólio

on:
  push:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # Atualizado para bater com suas dependências

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
        working-directory: ./Portfolio 

      # PASSO NOVO: Setup do Node para o React
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install JS Dependencies & Build
        run: |
          npm install
          npm run build
        working-directory: ./Portfolio

      - name: Directory Permissions
        run: chmod -R 777 Portfolio/storage Portfolio/bootstrap/cache

  deploy:
    needs: laravel-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Sync Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Portfolio/ 
          server-dir: ./public_html/
          # Excluímos o desnecessário para o deploy ser rápido
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            .env.example
